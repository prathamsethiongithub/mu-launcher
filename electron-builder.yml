appId: com.mastersunion.ember
artifactName: ${productName}-${version}-${arch}.${ext}
directories:
  buildResources: build
  output: dist
files:
- out/**/*
- package.json
nsis:
  allowToChangeInstallationDirectory: true
  # Never delete userData on uninstall — it holds the player's worlds,
  # saves, and accounts. Uninstalling the launcher must not erase them.
  deleteAppDataOnUninstall: false
  oneClick: false
  perMachine: false
  shortcutName: Ember
productName: Ember
publish:
- owner: prathamsethiongithub
  provider: github
  releaseType: release
  repo: mu-launcher
# No signing configured — v26 builds unsigned by default and skips the
# winCodeSign toolchain download entirely (the symlink-extraction failure
# that killed builds under v25 on machines without Developer Mode).
win:
  icon: build/icon.ico
  target:
  - nsis
