name: Release

# Windows-only, unsigned. The tag IS the release trigger: push v* and both
# artifacts are built and attached to a pre-release. No cross-platform matrix,
# no signing step, no auto-update feed — deliberately, for the first release.
on:
  push:
    tags:
      - 'v*'

# Needed for `gh release create` to write to the repo.
permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Unit Tests
        run: npm test

      - name: Build (Vite)
        run: npm run build

      - name: Package (NSIS + portable)
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (debuggable from the Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: Ember-Windows
          path: |
            dist/*Setup*.exe
            dist/*Portable*.exe

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*Setup*.exe dist/*Portable*.exe \
            --title "${GITHUB_REF_NAME}" \
            --notes "first release. 10 users. tell us what breaks.

          unsigned for now, so windows will warn you. right-click the file -> properties -> unblock, or more info -> run anyway. details in the README." \
            --prerelease
