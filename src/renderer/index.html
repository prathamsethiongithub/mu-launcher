<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Master Launcher</title>
    <!-- img-src includes data: for the player-skin render (skinview3d loads
         the skin via a data URL produced in the main process).
         connect-src stays 'self': version metadata (Mojang/Fabric/Quilt) is
         fetched by the MAIN process over IPC ('fetch-version-list') — the
         renderer never talks to the network directly. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
